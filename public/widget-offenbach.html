  .wd-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .wd-title { font-size: 1.2rem; font-weight: 700; color: #c8a86b; margin: 0; }
  .wd-today-tag {

    font-weight: 700;

  .wd-footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem; color: #b8c9a8; text-align: center; }
  .wd-footer a { color: #c8a86b; text-decoration: none; font-weight: 600; }
